<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card Studio - 數位名片</title>

<style>
:root{--bg:#f2f2f7;--fg:#1c1c1e;--bd:#e0e0e3;--mu:#6e6e73;--ac:#27316e;--acf:#fff;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--fg:#f2f2f4;--bd:#2c2c2e;--mu:#9d9da4}}
:root[data-theme="dark"]{--bg:#121214;--fg:#f2f2f4;--bd:#2c2c2e;--mu:#9d9da4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;transition:background .3s}
#page{min-height:100vh;display:flex;justify-content:center;background:inherit}
#card{width:100%;max-width:440px;min-height:100vh;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));position:relative;background:inherit;transition:background .3s}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* Header Bar */
#tb{position:fixed;top:0;left:0;right:0;z-index:10;max-width:440px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:rgba(255,255,255,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.05);color:#1c1c1e;transition:all .3s}
[data-theme="dark"] #tb,.t3 #tb,.t4 #tb,.t5 #tb,.t6 #tb{background:rgba(18,18,20,.75);color:#fff;border-bottom-color:rgba(255,255,255,.1)}
.tbl{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
#tba{width:34px;height:34px;border-radius:50%;overflow:hidden;background:rgba(0,0,0,.08);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
#tba img{width:100%;height:100%;object-fit:cover}
#tbn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:600}
.pill{border:0;border-radius:20px;background:var(--ac);color:var(--acf);padding:7px 14px;font:600 13px inherit;cursor:pointer;transition:transform .15s}
.pill:active{transform:scale(.95)}
#tbm{width:36px;height:36px;border:0;border-radius:50%;background:rgba(0,0,0,.05);color:inherit;display:grid;place-items:center;cursor:pointer}
[data-theme="dark"] #tbm{background:rgba(255,255,255,.1)}

/* Menu Dropdown */
#mbk{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.2);backdrop-filter:blur(4px);pointer-events:none;opacity:0;transition:opacity .2s}
#mbk:not([hidden]){pointer-events:auto;opacity:1}
#menu{position:fixed;z-index:16;top:calc(60px + env(safe-area-inset-top,0px));right:max(16px,calc(50% - 204px));width:220px;background:#fff;color:#1c1c1e;border-radius:20px;padding:8px;box-shadow:0 12px 36px rgba(0,0,0,.18);transform-origin:top right;animation:pop .2s cubic-bezier(0.16, 1, 0.3, 1)}
[data-theme="dark"] #menu{background:#222226;color:#f2f2f4}
#menu button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:12px 14px;border-radius:14px;font:500 14px inherit;cursor:pointer;text-align:left;color:inherit}
#menu button:active{background:rgba(0,0,0,.05)}
[data-theme="dark"] #menu button:active{background:rgba(255,255,255,.08)}
#menu span{width:20px;text-align:center;font-size:16px}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

/* Bottom Action Bar */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:440px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;background:linear-gradient(to top,var(--bg) 75%,transparent);pointer-events:none}
#bar > *{pointer-events:auto}
#vc{flex:1;border:0;border-radius:18px;padding:14px;background:var(--ac);color:var(--acf);font:700 15px inherit;cursor:pointer;box-shadow:0 8px 24px -4px rgba(0,0,0,.25);transition:transform .15s}
#vc:active{transform:scale(.98)}
#fab,#edb{width:50px;height:50px;border:0;border-radius:18px;background:#fff;color:#1c1c1e;font-size:18px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.1);display:grid;place-items:center;transition:transform .15s}
[data-theme="dark"] #fab,[data-theme="dark"] #edb{background:#2a2a2e;color:#fff}
#fab:active,#edb:active{transform:scale(.92)}

/* Bottom Sheet Editor */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;height:82vh;background:var(--bg);color:var(--fg);border-radius:28px 28px 0 0;max-width:500px;margin:0 auto;display:flex;flex-direction:column;transform:translateY(110%);visibility:hidden;transition:transform .3s cubic-bezier(0.16, 1, 0.3, 1),visibility 0s .3s;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
#sheet.open{transform:translateY(0);visibility:visible;transition:transform .3s cubic-bezier(0.16, 1, 0.3, 1)}
.top{padding:12px 20px 0;flex:none}
.grip{width:36px;height:5px;border-radius:3px;background:var(--bd);margin:0 auto 14px}
.bar{display:flex;gap:10px;align-items:center}
.seg{flex:1;display:flex;background:rgba(0,0,0,.06);border-radius:14px;padding:3px}
[data-theme="dark"] .seg{background:rgba(255,255,255,.08)}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:8px 4px;cursor:pointer;font:600 13px inherit;color:var(--mu);transition:all .2s}
.seg button.on{background:#fff;color:#1c1c1e;box-shadow:0 2px 8px rgba(0,0,0,.08)}
[data-theme="dark"] .seg button.on{background:#2c2c30;color:#fff}
#done{border:0;background:var(--ac);color:var(--acf);border-radius:14px;padding:9px 18px;font:700 14px inherit;cursor:pointer}
#form{flex:1;overflow-y:auto;padding:16px 20px calc(40px + env(safe-area-inset-bottom,0px))}
label{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--mu);margin-bottom:14px}
input[type=text],input[type=url],textarea,select{width:100%;background:rgba(0,0,0,.03);color:var(--fg);border:1.5px solid var(--bd);border-radius:14px;padding:12px;font:inherit;outline:none;transition:border-color .2s}
[data-theme="dark"] input[type=text],[data-theme="dark"] input[type=url],[data-theme="dark"] textarea,[data-theme="dark"] select{background:rgba(255,255,255,.05)}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:rgba(0,0,0,.02);border:1.5px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:14px}
[data-theme="dark"] .item{background:rgba(255,255,255,.03)}
.gb{background:none;color:var(--fg);border:1.5px solid var(--bd);border-radius:12px;padding:8px 14px;cursor:pointer;font:500 13px inherit;display:inline-flex;align-items:center;gap:6px}
.gb.on{border-color:var(--ac);color:var(--ac)}

/* Template Picker Miniatures */
.tp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.tp button{border:2px solid var(--bd);border-radius:16px;background:rgba(0,0,0,.02);color:var(--fg);padding:10px 6px;cursor:pointer;font:600 12px inherit;display:flex;flex-direction:column;align-items:center;gap:8px;transition:all .2s}
[data-theme="dark"] .tp button{background:rgba(255,255,255,.03)}
.tp button.on{border-color:var(--ac);background:rgba(39,49,110,.06)}
.tp-mini{width:100%;aspect-ratio:9/16;max-height:100px;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);position:relative;background:#fff}

/* Color Swatches */
.sw{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.sw button{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;transition:transform .15s;position:relative}
.sw button.on{outline:3px solid var(--ac);outline-offset:2px;transform:scale(1.05)}

/* Modal & Toast */
#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;pointer-events:none;opacity:0;transition:opacity .2s}
#modal:not([hidden]){pointer-events:auto;opacity:1}
.md{background:#fff;color:#1c1c1e;border-radius:28px;padding:24px;max-width:340px;width:100%;text-align:center;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.3)}
[data-theme="dark"] .md{background:#222226;color:#fff}
#mx{position:absolute;top:12px;right:12px;border:0;background:none;font-size:20px;width:36px;height:36px;cursor:pointer;color:var(--mu)}
.toast{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-20px);background:#1c1c1e;color:#fff;padding:10px 20px;border-radius:30px;font-weight:600;font-size:14px;opacity:0;transition:all .25s cubic-bezier(0.16, 1, 0.3, 1);pointer-events:none;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Dynamic Section Component Styling */
.sec-item{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.03);border:1.5px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:8px}
[data-theme="dark"] .sec-item{background:rgba(255,255,255,.04)}
.sec-item b{flex:1;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* =========================================================
   TEMPLATE LAYOUTS (t1 ~ t9)
   ========================================================= */

/* Commons */
.hero-img{width:100%;height:100%;object-fit:cover;object-position:50% var(--fy,50%)}
.av-img{object-fit:cover;object-position:50% var(--ay,50%);border-radius:inherit}
.lg-img{object-fit:contain}
.bio-text{white-space:pre-wrap;margin:0}
.ct-list{display:grid;gap:10px}
.ct-list a,.ct-list span{display:flex;align-items:center;gap:12px;font-size:14px}
.ct-list svg{flex:none;opacity:.75}

/* Theme 1: 沉浸大圖 (Immersion Visual) */
.t1{background:var(--bg)}
.t1 .hero-wrap{height:360px;position:relative;background:var(--ac)}
.t1 .hero-wrap:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,var(--bg))}
.t1 .card-body{margin-top:-60px;position:relative;z-index:2;padding:0 20px 20px;display:grid;gap:20px}
.t1 .profile-card{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.08);display:flex;gap:16px;align-items:center}
[data-theme="dark"] .t1 .profile-card{background:rgba(30,30,34,.85);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.t1 .av{width:76px;height:76px;border-radius:20px;overflow:hidden;flex:none;background:var(--ac);color:var(--acf);display:grid;place-items:center;font-size:28px;font-weight:700}

/* Theme 2: 雙色拼接 (Split Header) */
.t2{background:var(--bg)}
.t2 .header-bg{height:160px;background:var(--ac);position:relative}
.t2 .card-body{padding:0 20px 20px;margin-top:-50px;display:grid;gap:20px}
.t2 .av{width:100px;height:100px;border-radius:50%;border:4px solid var(--bg);overflow:hidden;background:#fff;color:var(--ac);display:grid;place-items:center;font-size:36px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.1)}

/* Theme 3: 精品雙框 (Luxury Frame) */
.t3{background:#161618;color:#f0f0f2}
.t3 #card{padding:80px 20px 100px}
.t3 .frame-box{border:1px solid rgba(212,175,55,.4);padding:24px;border-radius:4px;position:relative;display:grid;gap:20px;background:rgba(255,255,255,.02)}
.t3 .frame-box:before{content:"";position:absolute;inset:4px;border:1px solid rgba(212,175,55,.2);pointer-events:none}
.t3 .gold-title{color:#d4af37;font-family:serif;letter-spacing:1px}

/* Theme 4: 深色玻璃 (Glassmorphism) */
.t4{background:linear-gradient(135deg,#0f172a,#1e1b4b,#311042);color:#fff;min-height:100vh}
.t4 #card{padding:80px 20px 100px;display:grid;gap:16px}
.t4 .glass-panel{background:rgba(255,255,255,.07);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:20px}

/* Theme 5: 極簡置中 (Modern Centered) */
.t5{background:#fafaf9;color:#1c1917}
[data-theme="dark"] .t5{background:#1c1917;color:#fafaf9}
.t5 #card{padding:90px 24px 100px;text-align:center;display:grid;gap:24px;justify-items:center}
.t5 .av{width:110px;height:110px;border-radius:40px;overflow:hidden;margin:0 auto;box-shadow:0 12px 28px rgba(0,0,0,.08)}

/* Theme 6: 科技暗黑 (Cyberpunk Dark) */
.t6{background:#0a0d14;color:#00ffcc;font-family:monospace}
.t6 #card{padding:80px 20px 100px;display:grid;gap:16px}
.t6 .cyber-card{border:1px solid #00ffcc;background:rgba(0,255,204,.03);padding:18px;border-radius:12px;box-shadow:0 0 15px rgba(0,255,204,.1)}
.t6 a,.t6 button{color:#00ffcc!important}

/* Theme 7: 專業商務 (Executive Card) */
.t7{background:#f4f5f7}
[data-theme="dark"] .t7{background:#18191c}
.t7 #card{padding:80px 20px 100px;display:grid;gap:16px}
.t7 .biz-card{background:var(--ac);color:var(--acf);border-radius:20px;padding:24px;box-shadow:0 12px 32px rgba(0,0,0,.15);display:grid;gap:12px}

/* Theme 8: 馬卡龍柔和 (Pastel Soft) */
.t8{background:#fdf6f6;color:#4a3e3e}
.t8 #card{padding:80px 20px 100px;display:grid;gap:18px}
.t8 .soft-box{background:#fff;border-radius:24px;padding:20px;box-shadow:0 8px 24px rgba(230,200,200,.25)}

/* Theme 9: 空白 (Blank Canvas) */
.t9{background:var(--bg)}
.t9 #card{padding:80px 20px 100px;display:grid;gap:16px}

/* Buttons / Links Styles */
.btn-list{display:grid;gap:12px}
.btn-item{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.9);border-radius:16px;padding:14px 16px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.04);transition:transform .15s}
[data-theme="dark"] .btn-item{background:rgba(255,255,255,.06);box-shadow:none}
.btn-item:active{transform:scale(.98)}
.btn-icon{width:32px;height:32px;border-radius:10px;background:rgba(0,0,0,.05);display:grid;place-items:center;font-size:18px;flex:none}
[data-theme="dark"] .btn-icon{background:rgba(255,255,255,.1)}
.btn-icon img{width:100%;height:100%;object-fit:cover;border-radius:inherit}

/* Shape variants for links */
.shape-pill .btn-item{border-radius:999px}
.shape-square .btn-item{border-radius:8px}

.box-card{background:rgba(255,255,255,.8);border-radius:18px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.03)}
[data-theme="dark"] .box-card{background:rgba(255,255,255,.05)}
</style>
</head>
<body>

<div id="page">
  <div id="card"></div>
</div>

<!-- Header -->
<header id="tb">
  <div class="tbl">
    <span id="tba"></span>
    <b id="tbn">CARD STUDIO</b>
  </div>
  <button class="pill" id="tbs">前往網站</button>
  <button id="tbm" aria-label="開啟選單">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</header>

<!-- Menu Overlay -->
<div id="mbk" hidden></div>
<nav id="menu" hidden>
  <button data-m="qr"><span>▦</span>掃描 QR Code</button>
  <button data-m="img"><span>🖼</span>儲存名片圖片</button>
  <button data-m="share"><span>⤴</span>分享名片</button>
  <button data-m="vc"><span>👤</span>儲存聯絡人 (vCard)</button>
  <button data-m="ed"><span>✎</span>編輯 Card Studio</button>
</nav>

<!-- Modal -->
<div id="modal" hidden>
  <div class="md">
    <button id="mx" aria-label="關閉">✕</button>
    <div id="mbody"></div>
  </div>
</div>

<!-- Bottom Action Bar -->
<div id="bar">
  <button id="vc">儲存聯絡人</button>
  <button id="fab" aria-label="分享名片">⤴</button>
  <button id="edb" aria-label="編輯">✎</button>
</div>

<!-- Bottom Sheet Editor Drawer -->
<div id="sheet" role="dialog" aria-label="編輯名片">
  <div class="top">
    <div class="grip"></div>
    <div class="bar">
      <div class="seg" id="seg"></div>
      <button id="done">完成</button>
    </div>
  </div>
  <div id="form"></div>
</div>

<div class="toast" id="toast"></div>

<!-- External Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
const KEY = 'card_studio_v5_store';

const TYPES = {
  line:['LINE','💬'], ig:['Instagram','📷'], fb:['Facebook','👍'],
  threads:['Threads','@'], yt:['YouTube','▶'], linkedin:['LinkedIn','💼'],
  x:['X (Twitter)','🐦'], github:['GitHub','💻'], tg:['Telegram','✈️'],
  tel:['電話','📞'], mail:['Email','✉️'], site:['網站','🌐'], other:['連結','🔗']
};

const TEMPLATES = {
  t1: '沉浸大圖',
  t2: '雙色拼接',
  t3: '精品雙框',
  t4: '深色玻璃',
  t5: '極簡置中',
  t6: '科技暗黑',
  t7: '專業商務',
  t8: '馬卡龍柔和',
  t9: '空白'
};

const DEF = () => ({
  tpl: 't1',
  btnShape: 'rounded', // rounded, pill, square
  name: '林小安',
  title: '品牌設計總監',
  company: 'CARD STUDIO',
  tag: '打造數位形象與品牌頁面',
  bio: '嗨！我是小安。專注於協助個人與企業建立高質感的數位名片與一頁式品牌頁面。',
  phone: '0912-345-678',
  email: 'hello@cardstudio.design',
  addr: '台北市信義區忠孝東路五段 88 號',
  taxId: '88888888',
  site: 'https://cardstudio.design',
  avatar: '',
  logo: '',
  bg: '',
  ay: 50,
  fy: 50,
  ac: '#27316e',
  mode: 'light',
  order: ['profile', 'bio', 'contact', 'links', 'extras', 'company'],
  hide: {},
  links: [
    { type: 'line', label: '官方 LINE 帳號', url: '#', icon: '' },
    { type: 'ig', label: 'Instagram 作品集', url: '#', icon: '' },
    { type: 'site', label: '預約品牌諮詢', url: '#', icon: '' }
  ],
  extras: [
    { title: '服務項目', body: '• 品牌數位名片設計\n• UI/UX 視覺規劃\n• 一頁式 RWD 網站開發' }
  ]
});

let S;
try { S = Object.assign(DEF(), JSON.parse(localStorage.getItem(KEY) || '{}')); }
catch(e) { S = DEF(); }

let tab = 0;
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e) { toast('儲存容量已滿，請壓縮上傳圖片'); }
};

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove('show'), 2000);
}

function getHref(l) {
  const u = (l.url || '').trim();
  if(!u) return '#';
  if(l.type === 'tel') return 'tel:' + u;
  if(l.type === 'mail') return 'mailto:' + u;
  return /^https?:/.test(u) ? u : 'https://' + u;
}

/* Dynamic SVG Icons */
const SVG_ICONS = {
  ph: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
  ml: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',
  map: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'
};
const renderSvg = p => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

/* Render Card Studio Web App */
function render() {
  const c = $('#card');
  document.documentElement.setAttribute('data-theme', S.mode);
  c.style.setProperty('--ac', S.ac);
  
  // Set Template Base Class
  c.className = `${S.tpl} shape-${S.btnShape}`;
  $('#tbn').textContent = S.company || S.name || 'CARD STUDIO';
  $('#tba').innerHTML = S.logo ? `<img src="${S.logo}">` : S.avatar ? `<img src="${S.avatar}">` : (S.name||'C')[0];

  // Build Sections Data
  const avatarHtml = S.avatar 
    ? `<img class="av-img" src="${S.avatar}" style="object-position:50% ${S.ay}%">` 
    : `<div style="width:100%;height:100%;display:grid;place-items:center;background:var(--ac);color:#fff;font-weight:700;font-size:32px">${(S.name||'?')[0]}</div>`;

  const logoHtml = S.logo ? `<img class="lg-img" src="${S.logo}" style="max-height:40px">` : '';

  const contactHtml = (S.phone || S.email || S.addr) ? `
    <div class="ct-list box-card">
      ${S.phone ? `<a href="tel:${esc(S.phone)}">${renderSvg(SVG_ICONS.ph)} ${esc(S.phone)}</a>` : ''}
      ${S.email ? `<a href="mailto:${esc(S.email)}">${renderSvg(SVG_ICONS.ml)} ${esc(S.email)}</a>` : ''}
      ${S.addr ? `<span>${renderSvg(SVG_ICONS.map)} ${esc(S.addr)}</span>` : ''}
    </div>
  ` : '';

  const linksHtml = S.links.length ? `
    <div class="btn-list">
      ${S.links.map(l => `
        <a class="btn-item" href="${esc(getHref(l))}" target="_blank" rel="noopener">
          <span class="btn-icon">${l.icon ? `<img src="${l.icon}">` : TYPES[l.type][1]}</span>
          <span style="flex:1">${esc(l.label || TYPES[l.type][0])}</span>
          <span style="opacity:.4">›</span>
        </a>
      `).join('')}
    </div>
  ` : '';

  const extrasHtml = S.extras.map(e => `
    <div class="box-card">
      <h3 style="margin:0 0 8px;font-size:15px;font-weight:700">${esc(e.title)}</h3>
      <p class="bio-text" style="opacity:.9">${esc(e.body)}</p>
    </div>
  `).join('');

  const companyHtml = (S.company || S.taxId) ? `
    <div class="box-card" style="display:flex;align-items:center;gap:14px">
      ${logoHtml}
      <div>
        <div style="font-weight:700">${esc(S.company)}</div>
        ${S.tag ? `<div style="font-size:12px;opacity:.7">${esc(S.tag)}</div>` : ''}
        ${S.taxId ? `<div style="font-size:12px;opacity:.6">統一編號：${esc(S.taxId)}</div>` : ''}
      </div>
    </div>
  ` : '';

  const bioHtml = S.bio ? `<div class="box-card"><p class="bio-text">${esc(S.bio)}</p></div>` : '';

  // Render Layout Structural Variants
  if (S.tpl === 't1') {
    c.innerHTML = `
      <div class="hero-wrap">
        ${S.bg ? `<img class="hero-img" src="${S.bg}">` : ''}
      </div>
      <div class="card-body">
        <div class="profile-card">
          <div class="av">${avatarHtml}</div>
          <div>
            <h1 style="margin:0;font-size:24px;font-weight:700">${esc(S.name)}</h1>
            <div style="opacity:.8;font-size:14px">${esc(S.title)}</div>
            ${S.company ? `<div style="color:var(--ac);font-weight:600;font-size:13px;margin-top:2px">${esc(S.company)}</div>` : ''}
          </div>
        </div>
        ${bioHtml} ${linksHtml} ${contactHtml} ${extrasHtml} ${companyHtml}
      </div>
    `;
  } else if (S.tpl === 't2') {
    c.innerHTML = `
      <div class="header-bg" ${S.bg ? `style="background:url(${S.bg}) 50% ${S.fy}%/cover"` : ''}></div>
      <div class="card-body">
        <div style="display:flex;justify-content:space-between;align-items:flex-end">
          <div class="av">${avatarHtml}</div>
          ${logoHtml}
        </div>
        <div>
          <h1 style="margin:0;font-size:26px;font-weight:700">${esc(S.name)}</h1>
          <div style="color:var(--ac);font-weight:600">${esc(S.title)} ｜ ${esc(S.company)}</div>
        </div>
        ${linksHtml} ${bioHtml} ${contactHtml} ${extrasHtml} ${companyHtml}
      </div>
    `;
  } else if (S.tpl === 't3') {
    c.innerHTML = `
      <div class="frame-box">
        <div style="text-align:center">
          ${logoHtml}
          <h1 class="gold-title" style="font-size:28px;margin:10px 0 4px">${esc(S.name)}</h1>
          <div style="letter-spacing:1px;font-size:13px;opacity:.8">${esc(S.title)}</div>
        </div>
        ${bioHtml} ${linksHtml} ${contactHtml} ${extrasHtml} ${companyHtml}
      </div>
    `;
  } else if (S.tpl === 't4') {
    c.innerHTML = `
      <div class="glass-panel" style="display:flex;gap:16px;align-items:center">
        <div style="width:70px;height:70px;border-radius:50%;overflow:hidden;flex:none">${avatarHtml}</div>
        <div>
          <h1 style="margin:0;font-size:24px">${esc(S.name)}</h1>
          <div style="opacity:.8">${esc(S.title)}</div>
        </div>
      </div>
      ${bioHtml ? `<div class="glass-panel">${bioHtml}</div>` : ''}
      ${linksHtml ? `<div class="glass-panel">${linksHtml}</div>` : ''}
      ${contactHtml ? `<div class="glass-panel">${contactHtml}</div>` : ''}
      ${extrasHtml ? `<div class="glass-panel">${extrasHtml}</div>` : ''}
    `;
  } else if (S.tpl === 't5') {
    c.innerHTML = `
      <div class="av">${avatarHtml}</div>
      <div>
        <h1 style="margin:0;font-size:28px;font-weight:700;letter-spacing:-0.5px">${esc(S.name)}</h1>
        <div style="opacity:.7;margin-top:4px">${esc(S.title)}</div>
      </div>
      ${linksHtml} ${bioHtml} ${contactHtml} ${extrasHtml} ${companyHtml}
    `;
  } else if (S.tpl === 't6') {
    c.innerHTML = `
      <div class="cyber-card">
        <div style="font-size:12px;opacity:.6">// CARD_STUDIO_PROFILE</div>
        <h1 style="margin:6px 0;font-size:26px">&gt; ${esc(S.name)}</h1>
        <div>${esc(S.title)} @ ${esc(S.company)}</div>
      </div>
      ${bioHtml} ${linksHtml} ${contactHtml} ${extrasHtml}
    `;
  } else if (S.tpl === 't7') {
    c.innerHTML = `
      <div class="biz-card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="width:50px;height:50px;border-radius:12px;overflow:hidden">${avatarHtml}</div>
          ${logoHtml}
        </div>
        <div>
          <h1 style="margin:10px 0 2px;font-size:22px">${esc(S.name)}</h1>
          <div style="opacity:.8;font-size:13px">${esc(S.title)}</div>
        </div>
      </div>
      ${linksHtml} ${bioHtml} ${contactHtml} ${extrasHtml} ${companyHtml}
    `;
  } else if (S.tpl === 't8') {
    c.innerHTML = `
      <div class="soft-box" style="display:flex;gap:16px;align-items:center">
        <div style="width:70px;height:70px;border-radius:24px;overflow:hidden">${avatarHtml}</div>
        <div>
          <h1 style="margin:0;font-size:22px;color:#3b2d2d">${esc(S.name)}</h1>
          <div style="font-size:13px;color:#8c7b7b">${esc(S.title)}</div>
        </div>
      </div>
      ${linksHtml} ${bioHtml} ${contactHtml} ${extrasHtml}
    `;
  } else if (S.tpl === 't9') {
    // Blank Template
    c.innerHTML = `
      <div style="text-align:center;padding:20px 0">
        <div style="width:90px;height:90px;border-radius:50%;overflow:hidden;margin:0 auto 12px">${avatarHtml}</div>
        <h1 style="margin:0;font-size:26px">${esc(S.name)}</h1>
        <div style="opacity:.7">${esc(S.title)}</div>
      </div>
      ${linksHtml} ${bioHtml} ${contactHtml} ${extrasHtml} ${companyHtml}
    `;
  }
}

/* Template Miniature Generator */
function getTplMiniSvg(key) {
  const minis = {
    t1: `<rect width="36" height="18" fill="#27316e"/><rect x="4" y="14" width="28" height="26" rx="3" fill="#fff" stroke="#ddd"/><circle cx="10" cy="20" r="4" fill="#888"/>`,
    t2: `<rect width="36" height="12" fill="#27316e"/><circle cx="9" cy="12" r="5" fill="#fff" stroke="#27316e"/><rect x="4" y="20" width="28" height="4" rx="2" fill="#ddd"/>`,
    t3: `<rect x="3" y="3" width="30" height="38" fill="none" stroke="#d4af37" stroke-width="1.5"/><rect x="6" y="6" width="24" height="32" fill="none" stroke="#d4af37" stroke-dasharray="2,2"/>`,
    t4: `<rect width="36" height="44" fill="#1e1b4b"/><rect x="4" y="6" width="28" height="10" rx="2" fill="rgba(255,255,255,0.2)"/><rect x="4" y="20" width="28" height="18" rx="2" fill="rgba(255,255,255,0.1)"/>`,
    t5: `<circle cx="18" cy="12" r="6" fill="#888"/><rect x="8" y="22" width="20" height="3" rx="1.5" fill="#444"/><rect x="6" y="28" width="24" height="10" rx="5" fill="#ddd"/>`,
    t6: `<rect width="36" height="44" fill="#0a0d14"/><rect x="4" y="6" width="28" height="12" fill="none" stroke="#00ffcc"/><line x1="8" y1="12" x2="20" y2="12" stroke="#00ffcc"/>`,
    t7: `<rect x="4" y="6" width="28" height="16" rx="3" fill="#27316e"/><circle cx="10" cy="14" r="3" fill="#fff"/><rect x="4" y="26" width="28" height="12" rx="2" fill="#ddd"/>`,
    t8: `<rect width="36" height="44" fill="#fdf6f6"/><rect x="4" y="6" width="28" height="12" rx="4" fill="#fff"/><rect x="4" y="22" width="28" height="16" rx="4" fill="#fff"/>`,
    t9: `<rect width="36" height="44" fill="#fff"/><rect x="2" y="2" width="32" height="40" fill="none" stroke="#ccc" stroke-dasharray="3,3"/>`
  };
  return `<svg class="tp-mini" viewBox="0 0 36 44">${minis[key] || minis.t9}</svg>`;
}

/* Editor Drawer Form */
function renderForm() {
  $('#seg').innerHTML = ['內容資料', '按鈕與區塊', '版型風格'].map((x, i) => 
    `<button data-tab="${i}" class="${tab===i?'on':''}">${x}</button>`
  ).join('');

  const inp = (label, prop, val, type='text') => `
    <label>${label}<input type="${type}" data-p="${prop}" value="${esc(val)}"></label>
  `;

  const imgUp = (label, prop) => `
    <label>${label}
      <input type="file" accept="image/*" data-img="${prop}">
      ${S[prop] ? `<button class="gb" data-rm="${prop}" style="margin-top:6px">移除圖片</button>` : ''}
    </label>
  `;

  if (tab === 0) {
    $('#form').innerHTML = `
      ${inp('姓名', 'name', S.name)}
      ${inp('職稱', 'title', S.title)}
      ${inp('公司 / 品牌名稱', 'company', S.company)}
      ${inp('一句话簡介 / 副標題', 'tag', S.tag)}
      <label>個人簡介<textarea data-p="bio">${esc(S.bio)}</textarea></label>
      <div class="row">
        ${inp('電話', 'phone', S.phone)}
        ${inp('Email', 'email', S.email)}
      </div>
      ${inp('地址', 'addr', S.addr)}
      ${inp('統一編號', 'taxId', S.taxId)}
      ${inp('官方網站網址', 'site', S.site, 'url')}
      ${imgUp('個人頭像照片', 'avatar')}
      ${S.avatar ? `<label>頭像上下焦點位置 (Y-Axis)<input type="range" data-p="ay" min="0" max="100" value="${S.ay}"></label>` : ''}
      ${imgUp('品牌 LOGO', 'logo')}
      ${imgUp('封面/背景圖片', 'bg')}
      ${S.bg ? `<label>背景上下焦點位置 (Y-Axis)<input type="range" data-p="fy" min="0" max="100" value="${S.fy}"></label>` : ''}
    `;
  } else if (tab === 1) {
    $('#form').innerHTML = `
      <h4 style="margin:0 0 10px">連結按鈕</h4>
      ${S.links.map((l, i) => `
        <div class="item">
          <div class="row">
            <label>類型
              <select data-p="links.${i}.type">
                ${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${l.type===k?'selected':''}>${v[0]}</option>`).join('')}
              </select>
            </label>
            ${inp('名稱', `links.${i}.label`, l.label)}
          </div>
          ${inp('網址 / 號碼', `links.${i}.url`, l.url)}
          <label>自訂圖示 (ICON 上傳)
            <input type="file" accept="image/*" data-img="links.${i}.icon">
            ${l.icon ? `<button class="gb" data-rm="links.${i}.icon">恢復預設 ICON</button>` : ''}
          </label>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="gb" data-lm="${i},-1">↑ 上移</button>
            <button class="gb" data-lm="${i},1">↓ 下移</button>
            <button class="gb" data-dl="links,${i}" style="color:#e53e3e">刪除</button>
          </div>
        </div>
      `).join('')}
      <button class="gb" data-add="links" style="width:100%;justify-content:center;padding:12px;margin-bottom:24px">＋ 新增連結按鈕</button>

      <h4 style="margin:0 0 10px">自訂圖文區塊</h4>
      ${S.extras.map((e, i) => `
        <div class="item">
          ${inp('標題', `extras.${i}.title`, e.title)}
          <label>內容<textarea data-p="extras.${i}.body">${esc(e.body)}</textarea></label>
          <button class="gb" data-dl="extras,${i}" style="color:#e53e3e">刪除區塊</button>
        </div>
      `).join('')}
      <button class="gb" data-add="extras" style="width:100%;justify-content:center;padding:12px">＋ 新增圖文區塊</button>
    `;
  } else {
    $('#form').innerHTML = `
      <h4 style="margin:0 0 12px">選擇版型結構</h4>
      <div class="tp">
        ${Object.entries(TEMPLATES).map(([k, v]) => `
          <button data-tpl="${k}" class="${S.tpl===k?'on':''}">
            ${getTplMiniSvg(k)}
            <span>${v}</span>
          </button>
        `).join('')}
      </div>

      <h4 style="margin:16px 0 10px">按鈕外觀形狀</h4>
      <div style="display:flex;gap:10px;margin-bottom:20px">
        <button class="gb ${S.btnShape==='rounded'?'on':''}" data-shape="rounded">圓角卡片</button>
        <button class="gb ${S.btnShape==='pill'?'on':''}" data-shape="pill">膠囊圓弧</button>
        <button class="gb ${S.btnShape==='square'?'on':''}" data-shape="square">俐落方形</button>
      </div>

      <h4 style="margin:16px 0 10px">品牌主題色</h4>
      <div class="sw">
        ${['#27316e','#2b45f0','#1f7a8c','#2f5d4e','#9b8274','#a98235','#7a2e4d','#18181b'].map(c => `
          <button style="background:${c}" class="${S.ac===c?'on':''}" data-ac="${c}"></button>
        `).join('')}
      </div>

      <h4 style="margin:16px 0 10px">深淺色模式</h4>
      <div style="display:flex;gap:10px;margin-bottom:24px">
        <button class="gb ${S.mode==='light'?'on':''}" data-mode="light">淺色 Light</button>
        <button class="gb ${S.mode==='dark'?'on':''}" data-mode="dark">深色 Dark</button>
      </div>

      <button class="gb" id="rs" style="width:100%;justify-content:center;color:#e53e3e">重設為預設名片範例</button>
    `;
  }
}

/* Event Handlers */
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.p) {
    const ks = el.dataset.p.split('.');
    let o = S;
    ks.slice(0, -1).forEach(k => o = o[k]);
    o[ks.at(-1)] = el.value;
    save(); render();
  }
  if (el.dataset.img && el.files[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const cv = document.createElement('canvas');
        const max = el.dataset.img.includes('icon') ? 128 : 800;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        cv.width = img.width * scale;
        cv.height = img.height * scale;
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        
        const ks = el.dataset.img.split('.');
        let o = S;
        ks.slice(0, -1).forEach(k => o = o[k]);
        o[ks.at(-1)] = cv.toDataURL('image/jpeg', 0.8);
        save(); renderForm(); render();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(el.files[0]);
  }
});

$('#sheet').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;

  if (d.tab !== undefined) { tab = +d.tab; renderForm(); return; }
  if (d.tpl) S.tpl = d.tpl;
  if (d.shape) S.btnShape = d.shape;
  if (d.ac) S.ac = d.ac;
  if (d.mode) S.mode = d.mode;
  if (d.rm) {
    const ks = d.rm.split('.');
    let o = S;
    ks.slice(0, -1).forEach(k => o = o[k]);
    o[ks.at(-1)] = '';
  }
  if (d.lm) {
    const [i, dir] = d.lm.split(',').map(Number);
    const j = i + dir;
    if (j >= 0 && j < S.links.length) [S.links[i], S.links[j]] = [S.links[j], S.links[i]];
  }
  if (d.dl) {
    const [k, i] = d.dl.split(',');
    S[k].splice(+i, 1);
  }
  if (d.add) {
    if (d.add === 'links') S.links.push({ type: 'other', label: '新連結按鈕', url: '', icon: '' });
    if (d.add === 'extras') S.extras.push({ title: '新圖文區塊', body: '請輸入內容說明...' });
  }
  if (b.id === 'rs') {
    if (confirm('確定要清除所有自訂內容重設嗎？')) { S = DEF(); }
  }

  save(); renderForm(); render();
});

/* Menu & Modal Functionalities */
const openMenu = open => {
  $('#menu').hidden = !open;
  $('#mbk').hidden = !open;
};
$('#tbm').onclick = () => openMenu($('#menu').hidden);
$('#mbk').onclick = () => openMenu(false);

const showModal = html => {
  $('#mbody').innerHTML = html;
  $('#modal').hidden = false;
};
$('#mx').onclick = () => { $('#modal').hidden = true; };

/* Share & Tools */
async function shareCard() {
  const url = location.href;
  try {
    if (navigator.share) {
      await navigator.share({ title: S.name, text: `${S.name} 的數位名片`, url });
      return;
    }
  } catch(e) {}
  try {
    await navigator.clipboard.writeText(url);
    toast('已複製名片連結到剪貼簿');
  } catch(e) { toast('無法複製連結'); }
}
$('#fab').onclick = shareCard;
$('#tbs').onclick = () => {
  if (S.site) window.open(S.site, '_blank');
  else toast('請先在設定中填入網站網址');
};

$('#vc').onclick = () => {
  const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${S.name}\nTITLE:${S.title}\nORG:${S.company}\nTEL:${S.phone}\nEMAIL:${S.email}\nURL:${S.site}\nEND:VCARD`;
  const blob = new Blob([vcard], { type: 'text/vcard' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${S.name||'card'}.vcf`;
  a.click();
  toast('通訊錄檔案 (vCard) 已開始下載');
};

$('#edb').onclick = () => {
  renderForm();
  $('#sheet').classList.add('open');
};
$('#done').onclick = () => {
  $('#sheet').classList.remove('open');
  toast('內容已成功儲存');
};

$('#menu').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  openMenu(false);
  const action = b.dataset.m;

  if (action === 'qr') {
    showModal('<div id="qrb" style="display:flex;justify-content:center;margin:16px 0"></div><p style="font-size:13px;opacity:.7">掃描二維碼即可在手機開啟名片</p>');
    new QRCode($('#qrb'), { text: location.href, width: 200, height: 200 });
  } else if (action === 'img') {
    toast('正在生成名片高畫質圖片...');
    try {
      const cv = await html2canvas($('#card'), { scale: 2, useCORS: true, backgroundColor: null });
      showModal(`<img src="${cv.toDataURL('image/png')}" style="width:100%;border-radius:12px"><p style="font-size:13px;opacity:.7;margin-top:10px">長按圖片即可儲存至相簿</p>`);
    } catch(x) { toast('圖片生成失敗'); }
  } else if (action === 'share') shareCard();
  else if (action === 'vc') $('#vc').click();
  else if (action === 'ed') $('#edb').click();
});

// Init
render();
</script>
