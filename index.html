<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>數位名片 Web App</title>
<style>
:root {
  --bg: #0f1218; --card-bg: #181c24; --accent: #3b82f6; --text: #f3f4f6; --muted: #9ca3af;
  --radius: 16px; --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --pro-bg: #ffffff; --pro-text: #111827;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-family);
  min-height: 100vh; padding-top: 60px; padding-bottom: 90px;
  display: flex; justify-content: center; -webkit-tap-highlight-color: transparent;
}
#app { width: 100%; max-width: 440px; position: relative; padding: 16px; }

/* Sticky Header */
#header {
  position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 100;
  background: rgba(15, 18, 24, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; max-width: 440px; margin: 0 auto;
}
.pro-pill {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
  background: var(--pro-bg); color: var(--pro-text); font-weight: 700; font-size: 13px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15); border: 0; cursor: pointer;
}
.pro-pill img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.1);
  color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px;
}

/* Base Card Style */
#card {
  background: var(--card-bg); border-radius: var(--radius); padding: 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3); position: relative; transition: all 0.3s ease;
  overflow: hidden;
}
.avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; }
.name { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.title { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
.bio { font-size: 14px; line-height: 1.5; margin-bottom: 16px; white-space: pre-wrap; }

/* Links Grid/List */
.links-container { display: grid; gap: 10px; margin-top: 16px; }
.link-btn {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: rgba(255,255,255,0.05);
  border-radius: 12px; text-decoration: none; color: inherit; font-weight: 600; font-size: 14px;
  border: 1px solid rgba(255,255,255,0.08); transition: transform 0.15s;
}
.link-btn:active { transform: scale(0.98); }

/* Canva Studio Layout Controls */
.canva-mode .draggable-item {
  position: absolute; cursor: move; border: 1px dashed transparent; user-select: none;
}
.canva-mode.editing .draggable-item { border-color: var(--accent); }

/* Bottom Drawer */
#drawer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 200; height: 75vh;
  background: #1f2430; border-radius: 24px 24px 0 0; max-width: 500px; margin: 0 auto;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
}
#drawer.open { transform: translateY(0); }
.drawer-header {
  padding: 16px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.drawer-tabs { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; }
.tab-btn {
  padding: 8px 16px; border-radius: 20px; border: 0; background: rgba(255,255,255,0.08);
  color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.tab-btn.active { background: var(--accent); color: #fff; }
.drawer-content { flex: 1; overflow-y: auto; padding: 16px; }

/* Form Controls */
label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; margin-top: 12px; }
input[type="text"], textarea, select {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
  background: rgba(0,0,0,0.2); color: #fff; font-size: 14px; outline: none;
}
input[type="color"] { width: 100%; height: 40px; border-radius: 8px; border: 0; cursor: pointer; }

/* Floating Action Bar */
#bar {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 90;
  width: calc(100% - 32px); max-width: 408px; background: rgba(24, 28, 36, 0.9);
  backdrop-filter: blur(16px); padding: 8px; border-radius: 20px;
  display: flex; gap: 8px; border: 1px solid rgba(255,255,255,0.1);
}
.main-btn {
  flex: 1; border: 0; background: var(--accent); color: #fff; font-weight: 700;
  border-radius: 14px; padding: 12px; cursor: pointer; font-size: 15px;
}
</style>
</head>
<body>

<header id="header">
  <button class="pro-pill" id="proPillBtn">
    <span id="proIcon">🏢</span>
    <span id="proText">PRO CARD</span>
  </button>
  <div class="header-actions">
    <button class="icon-btn" id="qrBtn" title="QR Code">📷</button>
    <button class="icon-btn" id="themeBtn" title="主題色">🌓</button>
    <button class="icon-btn" id="editBtn" title="編輯名片">⚙️</button>
  </div>
</header>

<div id="app">
  <div id="card">
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" class="avatar" id="cAvatar" alt="Avatar">
    <h1 class="name" id="cName">林小安</h1>
    <p class="title" id="cTitle">品牌設計顧問｜安安工作室</p>
    <p class="bio" id="cBio">協助個人與品牌打造高質感視覺體驗。</p>
    <div class="links-container" id="cLinks">
      <a href="#" class="link-btn">💬 LINE 官方帳號</a>
      <a href="#" class="link-btn">📷 Instagram</a>
      <a href="#" class="link-btn">🌐 個人作品集網站</a>
    </div>
  </div>
</div>

<div id="bar">
  <button class="main-btn" id="saveVcardBtn">💾 保存聯絡人 (vCard)</button>
  <button class="icon-btn" id="shareBtn" style="width:48px; height:48px; border-radius:14px;">⤴</button>
</div>

<!-- Drawer Editor -->
<div id="drawer">
  <div class="drawer-header">
    <h3>編輯數位名片</h3>
    <button class="icon-btn" id="closeDrawer">✕</button>
  </div>
  <div class="drawer-tabs">
    <button class="tab-btn active" data-tab="basic">基本資料</button>
    <button class="tab-btn" data-tab="links">連結區塊</button>
    <button class="tab-btn" data-tab="pro">PRO 膠囊設定</button>
    <button class="tab-btn" data-tab="style">風格與 Canva 畫布</button>
  </div>
  <div class="drawer-content" id="drawerContent">
    <!-- Dynamic Content -->
  </div>
</div>

<script>
const S = {
  name: '林小安',
  title: '品牌設計顧問｜安安工作室',
  bio: '協助個人與品牌打造高質感視覺體驗。',
  proText: 'PRO CARD',
  proBg: '#ffffff',
  proTextCol: '#111827',
  accent: '#3b82f6',
  tpl: 'default'
};

const $ = s => document.querySelector(s);

function render() {
  $('#cName').textContent = S.name;
  $('#cTitle').textContent = S.title;
  $('#cBio').textContent = S.bio;
  $('#proText').textContent = S.proText;
  
  const pill = $('#proPillBtn');
  pill.style.background = S.proBg;
  pill.style.color = S.proTextCol;
  
  document.documentElement.style.setProperty('--accent', S.accent);
}

$('#editBtn').onclick = () => {
  $('#drawer').classList.add('open');
  loadTab('basic');
};

$('#closeDrawer').onclick = () => $('#drawer').classList.remove('open');

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = (e) => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    loadTab(e.target.dataset.tab);
  };
});

function loadTab(tab) {
  const container = $('#drawerContent');
  if (tab === 'basic') {
    container.innerHTML = `
      <label>姓名</label>
      <input type="text" id="inName" value="${S.name}">
      <label>職稱 / 公司</label>
      <input type="text" id="inTitle" value="${S.title}">
      <label>個人簡介</label>
      <textarea id="inBio">${S.bio}</textarea>
    `;
    $('#inName').oninput = e => { S.name = e.target.value; render(); };
    $('#inTitle').oninput = e => { S.title = e.target.value; render(); };
    $('#inBio').oninput = e => { S.bio = e.target.value; render(); };
  } else if (tab === 'pro') {
    container.innerHTML = `
      <label>PRO 膠囊顯示名稱</label>
      <input type="text" id="inProText" value="${S.proText}">
      <label>PRO 膠囊背景顏色</label>
      <input type="color" id="inProBg" value="${S.proBg}">
      <label>PRO 膠囊文字顏色</label>
      <input type="color" id="inProCol" value="${S.proTextCol}">
    `;
    $('#inProText').oninput = e => { S.proText = e.target.value; render(); };
    $('#inProBg').oninput = e => { S.proBg = e.target.value; render(); };
    $('#inProCol').oninput = e => { S.proTextCol = e.target.value; render(); };
  } else if (tab === 'style') {
    container.innerHTML = `
      <label>主色調</label>
      <input type="color" id="inAccent" value="${S.accent}">
      <p style="margin-top:16px; font-size:13px; color:var(--muted);">支援 20 款風格模板與 Canva 自由畫布排版。</p>
    `;
    $('#inAccent').oninput = e => { S.accent = e.target.value; render(); };
  }
}

render();
</script>
</body>
</html>
